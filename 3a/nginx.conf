user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;
events {
    worker_connections 1024;
}
stream{
    upstream backend_music_server{
        server server:1234;
    }

    server{
        listen 1234;
        proxy_pass backend_music_server;
        proxy_timeout 1h;
        proxy_connect_timeout 30s;
    }
}    
