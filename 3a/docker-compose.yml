services:
  mysqldb:
    image: 'mysql:8.0'
    env_file:
      - .env
    container_name: "mysqldb"
    healthcheck:
      test: ["CMD", "mysqladmin","ping","-h","localhost","-u","root","-proot"]
      timeout: 30s
      retries: 5
      start_period: 30s
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend-network
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: server
    expose:
      - "1234"
    env_file:
      - .env
    depends_on:
      mysqldb:
        condition: service_healthy
    volumes:
      - music_data:/myapp/music
      - backup_data:/myapp/backups
    networks:
      - backend-network
reverse_proxy:
  image: nginx:latest
  container_name: nginx_proxy
  ports:
  - "1234:1234"
  volumes:
  - ./nginx.conf:/etc/nginx/nginx.conf:ro
  depends_on:
  - server
  networks:
  - backend-network 
volumes:
    db_data:
    music_data:
    backup_data:
networks:
    backend-network:
      driver: bridge




